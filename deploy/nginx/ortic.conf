# Nginx untuk ortic.id (toko), admin.ortic.id (dashboard), api.ortic.id (API).
# Salin ke /etc/nginx/sites-available/ortic.conf, symlink ke sites-enabled, lalu:
#   sudo certbot --nginx -d ortic.id -d www.ortic.id -d admin.ortic.id -d api.ortic.id
# Certbot menambahkan blok listen 443 + sertifikat Let's Encrypt dan redirect HTTP -> HTTPS secara otomatis.

# Batas request per IP di depan API (lapisan kedua; API juga punya rate limit sendiri).
limit_req_zone $binary_remote_addr zone=ortic_api:10m rate=20r/s;

# ---------------------------------------------------------------------------
# Toko: build apps/web (npm run build --workspace @ortic/web) -> /srv/ortic/apps/web/dist
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name ortic.id www.ortic.id;
    root /srv/ortic/apps/web/dist;
    index index.html;

    # www -> apex
    if ($host = www.ortic.id) { return 301 https://ortic.id$request_uri; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: semua path lain ke index.html (router Vue).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Dashboard admin: build apps/admin -> /srv/ortic/apps/admin/dist
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.ortic.id;
    root /srv/ortic/apps/admin/dist;
    index index.html;

    # Dashboard tidak perlu diindeks mesin pencari.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# API: Node (PM2) di 127.0.0.1:4000. TRUST_PROXY=1 di .env API.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name api.ortic.id;

    client_max_body_size 6m;

    # Notifikasi dashboard (Server-Sent Events): jangan dibuffer, koneksi boleh lama.
    location /api/v1/admin/notifications/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        limit_req zone=ortic_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
